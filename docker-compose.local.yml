# AethOS self-host — run your own personal control plane on your machine.
#
#   1. cp .env.selfhost.example .env   (then fill in a model key + vault key)
#   2. docker compose -f docker-compose.local.yml up -d
#   3. open http://localhost:3000
#
# Single-user by construction: SELF_HOST=true disables the multi-tenant beta gate
# and the auth wall, and makes you the owner of your own instance. Data (vault,
# memory, artifacts) persists to the local `aethos_data` volume — nothing leaves
# your machine except calls to the model/provider keys you choose to add.

services:
  api:
    build: .
    image: aethos:local
    container_name: aethos-api
    env_file: .env
    environment:
      APP_ENV: production
      SELF_HOST: "true"
      DEPLOYMENT_MODE: local
      WORKER_MODE: embedded
      API_PORT: 8010
    ports:
      - "8010:8010"
    volumes:
      - aethos_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8010/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: aethos-web:local
    container_name: aethos-web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8010
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aethos_data:
