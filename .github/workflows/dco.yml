name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify every pull-request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a valid Signed-off-by line"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md and DCO.md."
            exit 1
          fi
