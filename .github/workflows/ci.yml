# AethOS CI — quality gates. Blocks merge on failing tests, typecheck, or lint.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Headless Linux runners have no OS keyring; vault tests need a backend.
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # Constrain known packages to the reviewed requirements.lock snapshot (§6).
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -e ".[dev,secrets,cloud]"
          # Headless Linux runners have no OS keyring; vault tests need a backend.
          pip install ruff keyrings.alt
      - name: Syntax check (compileall)
        run: python -m compileall -q aethos_core aethos_sdk
      - name: Lint (real errors only)
        # E9 syntax, F63/F7 bugs, F82 undefined names — block on genuine errors,
        # not style. Widen over time as the codebase adopts a full ruff config.
        run: ruff check --select=E9,F63,F7,F82 aethos_core aethos_sdk
      - name: Open-source release hygiene
        run: python scripts/check_public_release.py
      - name: Beta smoke harness (locking gate)
        env:
          USE_REAL_LLM: "false"
          ACTIVE_PROVIDER: "none"
        run: python -m pytest tests/test_beta_smoke_harness.py -q -p no:cacheprovider
      - name: Behavioral corpus (masterpiece gates)
        env:
          USE_REAL_LLM: "false"
          ACTIVE_PROVIDER: "none"
        run: bash scripts/run_behavioral_corpus.sh
      - name: Chat reliability gate
        env:
          USE_REAL_LLM: "false"
          ACTIVE_PROVIDER: "none"
        run: python -m pytest tests/test_chat_20_turn.py -q -p no:cacheprovider
      - name: Pytest (full suite)
        env:
          USE_REAL_LLM: "false"
          ACTIVE_PROVIDER: "none"
        run: python -m pytest tests -q -p no:cacheprovider

  web:
    name: Web typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build
