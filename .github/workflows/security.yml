# AethOS security gates: source policy, full-history secret scanning,
# dependency auditing, and software bills of materials.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  naming-gates:
    name: Forbidden-wording + static-agent gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Forbidden reference-project codenames (must be empty)
        run: |
          if grep -rinE "odysseus|openclaw|clawhub|exfoliate|paperclip|earendil|\bpi-coding\b|tongyi|llmfit|opencode" \
               aethos_core web --include=*.py --include=*.ts --include=*.tsx \
               | grep -v node_modules | grep -q .; then
            echo "::error::Forbidden reference-project codename found"
            grep -rinE "odysseus|openclaw|clawhub|exfoliate|paperclip|earendil|\bpi-coding\b|tongyi|llmfit|opencode" \
              aethos_core web --include=*.py --include=*.ts --include=*.tsx | grep -v node_modules
            exit 1
          fi
          echo "clean"
      - name: Static specialist-agent identifiers (must be empty)
        run: |
          if grep -rnE "engineering_agent|browser_evidence_agent|provider_operations_agent|mission_analyst_agent" \
               aethos_core web | grep -v node_modules | grep -q .; then
            echo "::error::Static specialist-agent identifier found"
            exit 1
          fi
          echo "clean"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Scan complete Git history
        run: >-
          gitleaks git . --no-banner --redact --config .gitleaks.toml
          --gitleaks-ignore-path .gitleaksignore --exit-code 1

  dependency-audit:
    name: Dependency audit + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Python project and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -e ".[dev,secrets,cloud]"
          pip install pip-audit==2.10.1 cyclonedx-bom==7.3.0
      - name: Generate Python SBOM
        run: >-
          cyclonedx-py environment --output-format JSON
          --output-file sbom-python.json
      - name: Audit installed Python environment
        run: pip-audit --strict --local
      - name: Web audit + SBOM
        working-directory: web
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-format JSON --output-file ../sbom-web.json
          npm audit --audit-level=high
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom-python.json
            sbom-web.json
          if-no-files-found: warn
