# AethOS production deployment — team server topology
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  api:
    build: .
    image: aethos:9.9
    container_name: aethos-api
    env_file: .env
    environment:
      APP_ENV: production
      DEPLOYMENT_MODE: team
      WORKER_MODE: embedded
      API_PORT: 8010
    ports:
      - "8010:8010"
    volumes:
      - aethos_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8010/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  worker:
    build: .
    image: aethos:9.9
    container_name: aethos-worker
    env_file: .env
    environment:
      APP_ENV: production
      DEPLOYMENT_MODE: team
      WORKER_MODE: standalone
    command: ["python", "-m", "aethos_core.runtime.worker_main"]
    volumes:
      - aethos_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: aethos-web:9.9
    container_name: aethos-web
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8010
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aethos_data:
    driver: local
