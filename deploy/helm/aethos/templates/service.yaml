apiVersion: v1
kind: Service
metadata:
  name: {{ include "aethos.fullname" . }}-api
spec:
  selector:
    app.kubernetes.io/name: aethos-api
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: {{ .Values.service.apiPort }}
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aethos.fullname" . }}-config
data:
  APP_ENV: {{ .Values.env.APP_ENV | quote }}
  DEPLOYMENT_MODE: {{ .Values.deploymentMode | quote }}
  WORKER_MODE: {{ .Values.workerMode | quote }}
  API_PORT: {{ .Values.service.apiPort | quote }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aethos.fullname" . }}-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aethos.fullname" . }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aethos.fullname" . }}-api
                port:
                  number: {{ .Values.service.apiPort }}
{{- end }}
