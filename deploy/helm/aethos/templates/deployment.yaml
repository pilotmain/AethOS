apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aethos.fullname" . }}-api
  labels:
    app.kubernetes.io/name: aethos-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aethos-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aethos-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.apiPort }}
          envFrom:
            - configMapRef:
                name: {{ include "aethos.fullname" . }}-config
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.service.apiPort }}
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/enterprise/health
              port: {{ .Values.service.apiPort }}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aethos.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aethos.fullname" . }}-worker
spec:
  replicas: {{ .Values.workerReplicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aethos-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aethos-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "-m", "aethos_core.runtime.worker_main"]
          envFrom:
            - configMapRef:
                name: {{ include "aethos.fullname" . }}-config
          env:
            - name: WORKER_MODE
              value: standalone
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aethos.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
